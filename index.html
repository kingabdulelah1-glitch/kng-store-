<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KNG STUDIO | FiveM & Discord Marketplace</title><meta name="description" content="KNG STUDIO - FiveM scripts, maps, vehicles, Discord designs and digital assets.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23050a18'/%3E%3Ctext x='50' y='70' font-size='56' font-family='Arial' font-weight='900' text-anchor='middle' fill='%2300e5ff'%3EK%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#050a18;--cd:rgba(255,255,255,.05);--tx:#e8f1ff;--mu:#8fa3c4;--c:#00e5ff;--bd:rgba(255,255,255,.12)}
[data-t=light]{--bg:#eef3fb;--cd:rgba(255,255,255,.8);--tx:#0a1128;--mu:#51618a;--bd:rgba(10,17,40,.15);--c:#0088aa}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,system-ui,sans-serif;background:radial-gradient(circle at 15% 0,#0b2a5588,transparent 50%),radial-gradient(circle at 90% 30%,#00e5ff18,transparent 40%),var(--bg);color:var(--tx);min-height:100vh}
header{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:10px 4%;backdrop-filter:blur(16px);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--bd)}
.logo{font-weight:900;font-size:21px;letter-spacing:2px;white-space:nowrap}.logo span,#hero h1 span{color:var(--c);text-shadow:0 0 20px var(--c)}
input,select,textarea{width:100%;padding:10px 14px;margin:5px 0;border-radius:12px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font:inherit}
button,.btn{cursor:pointer;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:12px;padding:9px 14px;font:inherit}
.btn{background:linear-gradient(135deg,#00e5ff,#2979ff);color:#021024;font-weight:700;border:0;text-decoration:none;display:inline-block;margin:4px 0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--c)}
#hero{text-align:center;padding:80px 5% 50px}#hero h1{font-size:clamp(46px,10vw,104px);margin:0;font-weight:900;letter-spacing:5px;animation:in 1s ease both}.sl{color:var(--c);letter-spacing:6px;font-weight:700}#hero p{color:var(--mu);max-width:560px;margin:10px auto}
@keyframes in{from{opacity:0;filter:blur(14px);letter-spacing:22px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 4%}.chip{white-space:nowrap}.chip.on{background:var(--c);color:#021024;border-color:var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;padding:10px 4% 50px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:12px;backdrop-filter:blur(12px);cursor:pointer;transition:.25s;position:relative}.card:hover{transform:translateY(-5px);box-shadow:0 0 28px #00e5ff40;border-color:var(--c)}
.im{height:150px;border-radius:12px;background:linear-gradient(135deg,#0b2a55,#00e5ff55) center/cover}.card h3{margin:10px 0 4px;font-size:16px}.pr s{color:var(--mu)}.pr b{color:var(--c)}.bd{position:absolute;top:18px;inset-inline-start:18px;background:var(--c);color:#021024;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}
#m{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:9;padding:14px}#m.on{display:flex}
.box{background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:22px;width:min(640px,100%);max-height:90vh;overflow:auto;position:relative}.x{position:absolute;top:10px;inset-inline-end:10px}
.gal{display:flex;gap:8px;overflow-x:auto}.gal img{height:130px;border-radius:10px}.row{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--c);color:#021024;padding:10px 20px;border-radius:12px;font-weight:700;display:none;z-index:99}
#ld{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;letter-spacing:6px;z-index:99;color:var(--c);transition:.5s}
footer{border-top:1px solid var(--bd);padding:30px 4%;color:var(--mu);display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between}footer a{color:var(--c);cursor:pointer}
</style></head><body>
<div id="ld">KNG</div><script>setTimeout(()=>{var l=document.getElementById('ld');l&&l.remove()},5000)</script>
<header><div class="logo">KNG <span>STUDIO</span></div><input id="bs" oninput="q=this.value.toLowerCase();render()"><button id="bl" onclick="L=L=='ar'?'en':'ar';localStorage.l=L;render()">EN/ع</button><button onclick="T=T=='dark'?'light':'dark';localStorage.t=T;render()">◐</button><button onclick="cartM()">🛒<span id="cn"></span></button><span id="bu"></span></header>
<section id="hero"></section><div class="chips" id="chips"></div><div class="grid" id="grid"></div>
<footer><span>© KNG STUDIO</span><a id="sup" onclick="supM()"></a><a id="wa" target="_blank">WhatsApp</a></footer>
<div id="m" onclick="if(event.target==this)X()"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D={ar:{search:'ابحث عن منتج...',all:'الكل',add:'أضف للسلة',buy:'اشترِ الآن',cart:'السلة',empty:'السلة فارغة',login:'دخول',signup:'حساب جديد',forgot:'نسيت كلمة المرور؟',logout:'خروج',total:'الإجمالي',coupon:'كود الخصم',apply:'تطبيق',proof:'ارفع صورة إثبات التحويل',send:'إرسال الطلب',sar:'ر.س',pending:'بانتظار المراجعة',paid:'مدفوع',rejected:'مرفوض',dl:'تحميل',sub:'متجر الملفات الرقمية: سكربتات FiveM، خرائط، سيارات، تصاميم ديسكورد وأكثر.',email:'البريد',pass:'كلمة المرور',name:'الاسم',ok:'تم',err:'حدث خطأ',admin:'الإدارة',noorders:'لا توجد طلبات',rev:'التقييمات',shop:'تصفح المنتجات',specs:'المواصفات',compat:'التوافق',install:'طريقة التثبيت',rel:'منتجات مشابهة',sup:'الدعم والأسئلة',msg:'رسالتك',acc:'طلباتي ومشترياتي',faq:'الأسئلة الشائعة: بعد التحويل ترفع الإثبات، وعند الموافقة يظهر زر التحميل في حسابك.',newp:'منتج جديد',pa:'الاسم (عربي)',pe:'الاسم (إنجليزي)',da:'الوصف (عربي)',de:'الوصف (إنجليزي)',pc:'السعر',pd:'سعر الخصم',ft:'مميز',newpass:'كلمة مرور جديدة',save:'حفظ',pct:'نسبة الخصم %'},
en:{search:'Search products...',all:'All',add:'Add to cart',buy:'Buy now',cart:'Cart',empty:'Your cart is empty',login:'Log in',signup:'Sign up',forgot:'Forgot password?',logout:'Log out',total:'Total',coupon:'Coupon code',apply:'Apply',proof:'Upload payment proof',send:'Send order',sar:'SAR',pending:'Pending review',paid:'Paid',rejected:'Rejected',dl:'Download',sub:'Digital marketplace: FiveM scripts, maps, vehicles, Discord designs and more.',email:'Email',pass:'Password',name:'Name',ok:'Done',err:'Something went wrong',admin:'Admin',noorders:'No orders',rev:'Reviews',shop:'Browse products',specs:'Specifications',compat:'Compatibility',install:'Installation',rel:'Related products',sup:'Support & FAQ',msg:'Your message',acc:'My orders & downloads',faq:'FAQ: after paying, upload your proof. Once approved, the download button appears in your account.',newp:'New product',pa:'Name (Arabic)',pe:'Name (English)',da:'Description (Arabic)',de:'Description (English)',pc:'Price',pd:'Discount price',ft:'Featured',newpass:'New password',save:'Save',pct:'Discount %'}};
const t=k=>D[L][k]||k,sb=(()=>{try{return supabase.createClient(CFG.url,CFG.key)}catch(e){document.body.innerHTML='<div style="padding:60px 20px;font:700 22px Cairo,sans-serif;color:#00e5ff;text-align:center;background:#050a18;min-height:100vh">افتح ملف config.js وضع رابط Supabase والمفتاح الصحيحين، ثم أعد تحميل الصفحة.</div>';throw e}})(),pr=p=>+(p.discount_price??p.price);
let L=localStorage.l||'ar',T=localStorage.t||'dark',cats=[],prods=[],cart=JSON.parse(localStorage.c||'[]'),user=null,isAdmin=false,cat='',q='',cp=null;
const toast=m=>{const e=$('#toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2800)};
const M=h=>{$('#m').innerHTML=`<div class=box><button class=x onclick="X()">✕</button>${h}</div>`;$('#m').classList.add('on')},X=()=>$('#m').classList.remove('on');
const sv=()=>{localStorage.c=JSON.stringify(cart);render()};
function render(){const h=document.documentElement;h.lang=L;h.dir=L=='ar'?'rtl':'ltr';h.dataset.t=T;$('#bs').placeholder=t('search');
$('#hero').innerHTML=`<p class=sl>CREATE. DESIGN. DOMINATE.</p><h1>KNG <span>STUDIO</span></h1><p>${t('sub')}</p><a class=btn href="#grid">${t('shop')}</a>`;
$('#chips').innerHTML=[['',t('all')],...cats.map(c=>[c.id,c['name_'+L]])].map(([i,n])=>`<button class="chip ${cat==i?'on':''}" onclick="cat='${i}';render()">${esc(n)}</button>`).join('');
const f=prods.filter(p=>(!cat||p.category_id==cat)&&`${p.name_ar} ${p.name_en} ${p.desc_ar} ${p.desc_en}`.toLowerCase().includes(q)).sort((a,b)=>b.featured-a.featured);
$('#grid').innerHTML=f.map(p=>`<div class=card onclick="show('${p.id}')">${p.discount_price?`<span class=bd>-${Math.round(100-p.discount_price/p.price*100)}%</span>`:p.featured?`<span class=bd>★</span>`:''}<div class=im style="background-image:url('${esc(p.images?.[0]||'')}')"></div><h3>${esc(p['name_'+L])}</h3><div class=pr>${p.discount_price?`<s>${p.price}</s> `:''}<b>${pr(p)} ${t('sar')}</b></div><button class=btn onclick="event.stopPropagation();add('${p.id}')">${t('add')}</button></div>`).join('');
$('#cn').textContent=cart.length?' '+cart.reduce((a,i)=>a+i.q,0):'';$('#sup').textContent=t('sup');$('#wa').href='https://wa.me/'+CFG.whatsapp;
$('#bu').innerHTML=user?`${isAdmin?`<button onclick="adm()">⚙</button>`:''}<button onclick="acct()">👤</button><button onclick="sb.auth.signOut()">${t('logout')}</button>`:`<button onclick="auth()">${t('login')}</button>`}
function add(id,go){const i=cart.find(x=>x.id==id);i?i.q++:cart.push({id,q:1});sv();toast(t('ok'));if(go)cartM()}
async function show(id){const p=prods.find(x=>x.id==id),{data:r}=await sb.from('reviews').select('*').eq('product_id',id).order('created_at',{ascending:false}),avg=r?.length?(r.reduce((a,b)=>a+b.rating,0)/r.length).toFixed(1):'–';
M(`<h2>${esc(p['name_'+L])}</h2><div class=gal>${(p.images||[]).map(i=>`<img src="${esc(i)}" alt="">`).join('')}</div><p>${esc(p['desc_'+L])}</p>${['specs','compat','install'].map(k=>p[k]?`<h4>${t(k)}</h4><p>${esc(p[k])}</p>`:'').join('')}<p class=pr>${p.discount_price?`<s>${p.price}</s> `:''}<b>${pr(p)} ${t('sar')}</b></p><button class=btn onclick="add('${id}')">${t('add')}</button> <button class=btn onclick="add('${id}',1)">${t('buy')}</button>
<h4>${t('rel')}</h4>${prods.filter(x=>x.category_id==p.category_id&&x.id!=id).slice(0,3).map(x=>`<button onclick="show('${x.id}')">${esc(x['name_'+L])}</button>`).join(' ')}
<h4>${t('rev')} ⭐ ${avg}</h4>${(r||[]).map(x=>`<p>${'★'.repeat(x.rating)} ${esc(x.comment)}</p>`).join('')}${user?`<select id=rr>${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join('')}</select><input id=rc><button onclick="rate('${id}')">${t('save')}</button>`:''}`)}
async function rate(id){const{error}=await sb.from('reviews').insert({product_id:id,user_id:user.id,rating:+$('#rr').value,comment:$('#rc').value});error?toast(error.message):show(id)}
const sub=()=>cart.reduce((a,i)=>a+pr(prods.find(p=>p.id==i.id))*i.q,0),tot=()=>sub()*(1-(cp?.percent||0)/100);
function cartM(){M(`<h2>${t('cart')}</h2>${cart.map((i,n)=>{const p=prods.find(x=>x.id==i.id);return `<div class=row><span>${esc(p['name_'+L])}</span><span><button onclick="cart[${n}].q++;sv();cartM()">+</button> ${i.q} <button onclick="cart[${n}].q--;if(!cart[${n}].q)cart.splice(${n},1);sv();cartM()">−</button></span><b>${pr(p)*i.q}</b></div>`}).join('')||`<p>${t('empty')}</p>`}${cart.length?`<input id=cc placeholder="${t('coupon')}" value="${cp?.code||''}"><button onclick="coupon()">${t('apply')}</button><h3>${t('total')}: ${tot().toFixed(2)} ${t('sar')}</h3><p>${esc(CFG.payInfo)}</p><label>${t('proof')}<input id=pf type=file accept="image/*,.pdf"></label><button class=btn onclick="send()">${t('send')}</button>`:''}`)}
async function coupon(){const{data}=await sb.from('coupons').select('*').eq('code',$('#cc').value.trim().toUpperCase()).eq('active',true).maybeSingle();cp=data;toast(data?data.percent+'%':t('err'));cartM()}
async function send(){if(!user)return auth();const f=$('#pf').files[0];if(!f)return toast(t('proof'));const id=crypto.randomUUID(),path=`${user.id}/${id}-${f.name.replace(/[^\w.-]/g,'_')}`,u=await sb.storage.from('payment-proofs').upload(path,f);if(u.error)return toast(u.error.message);
const{error}=await sb.from('orders').insert({id,user_id:user.id,total:+tot().toFixed(2),coupon:cp?.code||null,proof_path:path});if(error)return toast(error.message);
await sb.from('order_items').insert(cart.map(i=>({order_id:id,product_id:i.id,price:pr(prods.find(p=>p.id==i.id))*i.q})));cart=[];cp=null;sv();toast(t('ok'));acct()}
async function acct(){const{data}=await sb.from('orders').select('*,order_items(price,products(name_ar,name_en,file_path))').eq('user_id',user.id).order('created_at',{ascending:false});
M(`<h2>${t('acc')}</h2>${(data||[]).map(o=>`<div class=row style="display:block"><b>#${o.id.slice(0,8)}</b> · ${o.total} ${t('sar')} · ${t(o.status)}${o.status=='paid'?o.order_items.map(i=>`<div><button class=btn onclick="dl('${esc(i.products.file_path)}')">⬇ ${esc(i.products['name_'+L])}</button></div>`).join(''):''}</div>`).join('')||t('noorders')}`)}
async function dl(p){const{data,error}=await sb.storage.from('product-files').createSignedUrl(p,60);error?toast(error.message):window.open(data.signedUrl)}
function auth(){M(`<h2>${t('login')}</h2><input id=ae type=email placeholder="${t('email')}"><input id=ap type=password placeholder="${t('pass')}"><input id=an placeholder="${t('name')}"><button class=btn onclick="lg()">${t('login')}</button> <button onclick="su()">${t('signup')}</button><p><a href="#" onclick="fp();return false">${t('forgot')}</a></p>`)}
const cr=()=>({email:$('#ae').value,password:$('#ap').value});
async function lg(){const{error}=await sb.auth.signInWithPassword(cr());error?toast(error.message):(X(),toast(t('ok')))}
async function su(){const{error}=await sb.auth.signUp({...cr(),options:{data:{full_name:$('#an').value}}});toast(error?error.message:t('ok'))}
async function fp(){const{error}=await sb.auth.resetPasswordForEmail($('#ae').value,{redirectTo:location.href.split('#')[0]});toast(error?error.message:t('ok'))}
function supM(){M(`<h2>${t('sup')}</h2><p>${t('faq')}</p><input id=se type=email placeholder="${t('email')}"><textarea id=sm placeholder="${t('msg')}"></textarea><button class=btn onclick="tk()">${t('send')}</button>`)}
async function tk(){const{error}=await sb.from('tickets').insert({email:$('#se').value,message:$('#sm').value});error?toast(error.message):(X(),toast(t('ok')))}
async function adm(){const{data:o}=await sb.from('orders').select('*').order('created_at',{ascending:false}),rows=await Promise.all((o||[]).map(async x=>{const s=x.proof_path?(await sb.storage.from('payment-proofs').createSignedUrl(x.proof_path,300)).data?.signedUrl:'';return `<div class=row><span>#${x.id.slice(0,8)} · ${x.total} · ${t(x.status)}</span>${s?`<a href="${s}" target=_blank>📎</a>`:''}${x.status=='pending'?`<span><button onclick="ord('${x.id}','paid')">✔</button><button onclick="ord('${x.id}','rejected')">✖</button></span>`:''}</div>`})),pd=(o||[]).filter(x=>x.status=='paid');
M(`<h2>${t('admin')}</h2><p>📊 ${pd.length} · ${pd.reduce((a,b)=>a+ +b.total,0)} ${t('sar')}</p>${rows.join('')||t('noorders')}<h3>${t('newp')}</h3><select id=fc>${cats.map(c=>`<option value=${c.id}>${esc(c.name_ar)}</option>`).join('')}</select>${[['na','pa'],['ne','pe'],['dsa','da'],['dse','de'],['sp','specs'],['cm','compat'],['ins','install'],['pc','pc'],['pdc','pd']].map(([i,k])=>`<input id=${i} placeholder="${t(k)}">`).join('')}<label>IMG<input id=fi type=file accept="image/*" multiple></label><label>FILE (zip/rar/lua/sql)<input id=ff type=file></label><label><input id=fe type=checkbox style="width:auto"> ${t('ft')}</label><button class=btn onclick="addp()">${t('save')}</button>
<h3>${t('coupon')}</h3><input id=kc placeholder="CODE"><input id=kp type=number placeholder="${t('pct')}"><button onclick="addc()">${t('save')}</button><h3>×</h3>${prods.map(p=>`<div class=row><span>${esc(p.name_ar)}</span><button onclick="delp('${p.id}')">🗑</button></div>`).join('')}`)}
async function ord(id,s){await sb.from('orders').update({status:s}).eq('id',id);adm()}
async function addc(){const{error}=await sb.from('coupons').insert({code:$('#kc').value.toUpperCase(),percent:+$('#kp').value});toast(error?error.message:t('ok'))}
async function delp(id){await sb.from('products').delete().eq('id',id);init()}
async function addp(){const up=async(b,f,pub)=>{const p=Date.now()+'-'+f.name.replace(/[^\w.-]/g,'_'),r=await sb.storage.from(b).upload(p,f);if(r.error)throw r.error;return pub?sb.storage.from(b).getPublicUrl(p).data.publicUrl:p},v=i=>$('#'+i).value;
try{const im=[];for(const f of $('#fi').files)im.push(await up('product-images',f,1));const fl=$('#ff').files[0]?await up('product-files',$('#ff').files[0]):null;
const{error}=await sb.from('products').insert({category_id:+v('fc'),name_ar:v('na'),name_en:v('ne'),desc_ar:v('dsa'),desc_en:v('dse'),specs:v('sp'),compat:v('cm'),install:v('ins'),price:+v('pc'),discount_price:v('pdc')?+v('pdc'):null,images:im,file_path:fl,featured:$('#fe').checked});if(error)throw error;toast(t('ok'));X();init()}catch(e){toast(e.message)}}
async function setUser(u){user=u||null;isAdmin=false;if(user){const{data}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();isAdmin=data?.role=='admin'}render()}
async function init(){const[c,p]=await Promise.all([sb.from('categories').select('*').order('id'),sb.from('products').select('*').eq('active',true).order('created_at',{ascending:false})]);cats=c.data||[];prods=p.data||[];render()}
sb.auth.onAuthStateChange((e,s)=>{setUser(s?.user);if(e=='PASSWORD_RECOVERY')M(`<h2>${t('newpass')}</h2><input id=np type=password><button class=btn onclick="sb.auth.updateUser({password:$('#np').value}).then(r=>{toast(r.error?r.error.message:t('ok'));X()})">${t('save')}</button>`)});
render();init().finally(()=>{$('#ld').style.opacity=0;setTimeout(()=>$('#ld').remove(),500)});
</script></body></html>
